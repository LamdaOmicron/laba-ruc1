<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛР №1 · Командные роли Белбина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2b26; --ink2:#26443e;
  --paper:#f4f6f0; --paper2:#e7ede2; --mint:#dcefe3;
  --amber:#ffb02e; --amber-d:#e29410;
  --coral:#e4572e; --teal:#0f7b6c; --teal-l:#4fb3a1;
  --shadow:6px 6px 0 rgba(13,43,38,.9);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(15,123,108,.5),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(255,176,46,.14),transparent 60%),
  linear-gradient(160deg,#0d2b26 0%,#123830 55%,#0a201c 100%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(220,239,227,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(220,239,227,.06) 1px,transparent 1px);
  background-size:34px 34px}
.orb{position:fixed;z-index:0;pointer-events:none;color:rgba(220,239,227,.10);font-family:'Unbounded'}
.orb.o1{top:7%;left:4%;font-size:110px;animation:drift 14s ease-in-out infinite alternate}
.orb.o2{bottom:6%;right:5%;width:180px;height:180px;border:3px solid rgba(255,176,46,.25);border-radius:50%;animation:drift 18s ease-in-out infinite alternate-reverse}
.orb.o3{top:55%;left:-40px;width:130px;height:130px;border:3px dashed rgba(220,239,227,.18);animation:spin 42s linear infinite}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(26px,-30px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(374deg)}}
main{position:relative;z-index:1;max-width:1150px;margin:0 auto;padding:44px 20px 80px}
h1,h2,.disp{font-family:'Unbounded',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--shadow);position:relative}
.perf{height:12px;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--amber) 0 14px,var(--ink) 14px 18px,transparent 18px 30px)}
.btn{font-family:'Unbounded';font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--amber);color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:13px 24px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:#ffc258}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)} .btn.ghost:hover{background:var(--mint)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tag{display:inline-block;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--mint);padding:5px 12px;border-radius:2px}
.tag.amber{background:var(--amber);color:var(--ink)} .tag.teal{background:var(--teal);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ── ВВОД ── */
.intro{display:grid;grid-template-columns:1.15fr .95fr;gap:44px;align-items:start;animation:rise .6s ease both}
.kicker{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.28em;color:var(--amber);text-transform:uppercase;margin-bottom:18px}
.intro h1{color:var(--paper);font-size:clamp(32px,5vw,58px);font-weight:900;line-height:1.05;margin-bottom:20px}
.intro h1 em{font-style:normal;color:var(--amber)}
.lede{color:#bcd8cb;font-size:16.5px;line-height:1.65;max-width:54ch;margin-bottom:28px}
.scale{list-style:none;border-top:1px solid rgba(220,239,227,.25);margin-bottom:28px}
.scale li{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid rgba(220,239,227,.25);color:#dcefe3}
.scale b{font-family:'Unbounded';width:34px;height:34px;flex:none;display:grid;place-items:center;border:2px solid rgba(220,239,227,.4);border-radius:3px;font-size:15px}
.scale li.s2 b{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.scale li.s1 b{background:var(--teal);color:#fff;border-color:var(--teal)}
.scale li.s0 b{background:rgba(220,239,227,.15)}
.scale span{font-size:14.5px}
.meta-rows{list-style:none;border-top:1px solid rgba(220,239,227,.25)}
.meta-rows li{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid rgba(220,239,227,.25);color:#dcefe3}
.meta-rows .k{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8fb7a8}
.meta-rows .v{font-weight:600}
.intro .sheet{overflow:hidden}
.intro .body{padding:26px 26px 30px}
.watermark{position:absolute;right:-16px;bottom:-30px;font-family:'Unbounded';font-weight:900;font-size:110px;color:rgba(13,43,38,.06);pointer-events:none}
label.f{display:block;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:16px 0 7px}
input.f{width:100%;padding:13px 14px;font:500 15px 'IBM Plex Sans';border:2px solid var(--ink);border-radius:3px;background:#fff;transition:box-shadow .15s}
input.f:focus{outline:none;box-shadow:3px 3px 0 var(--amber)}
.note{font-size:13.5px;line-height:1.6;color:var(--ink2);background:var(--mint);border-left:4px solid var(--teal);padding:12px 14px;margin:18px 0}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.resume{margin-top:12px;font-size:13px;color:var(--ink2)}
.resume a{color:var(--teal);font-weight:600;cursor:pointer}

/* ── ОПРОС ── */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--shadow);padding:12px 18px;margin-bottom:20px;position:sticky;top:12px;z-index:5}
.bar .id{font-family:'JetBrains Mono';font-size:12px}
.bar .grow{flex:1;min-width:130px}
.track{height:10px;background:var(--paper2);border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,var(--amber-d) 10px 20px);transition:width .45s cubic-bezier(.6,0,.2,1)}
.pages{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.ppill{font-family:'JetBrains Mono';font-size:12px;padding:7px 14px;border:2px solid rgba(220,239,227,.5);background:transparent;color:#9fc4b5;border-radius:3px;cursor:pointer;transition:.15s}
.ppill:hover{border-color:var(--amber);color:var(--amber)}
.ppill.cur{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.ppill.done{border-color:var(--teal-l);color:var(--teal-l)}
.dotmap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.dot{width:17px;height:17px;border:1.5px solid rgba(220,239,227,.4);border-radius:2px;cursor:pointer;transition:.15s;padding:0}
.dot:hover{border-color:var(--amber);transform:scale(1.25)}
.dot.done{background:var(--amber);border-color:var(--amber)}
.dot.cur{border-color:var(--paper);box-shadow:0 0 0 2px rgba(255,176,46,.55)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);padding:12px 20px;border-bottom:2px solid var(--ink);background:var(--paper2)}
.legend i{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink);margin-right:6px;vertical-align:-2px;border-radius:2px}
.qsheet{overflow:hidden;animation:cardIn .4s ease both}
@keyframes cardIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:16px;align-items:center;padding:13px 20px;border-bottom:1px dashed #b9c8b6;transition:background .15s}
.row:hover{background:var(--mint)}
.row.flash{animation:flashbg 1.4s ease}
@keyframes flashbg{0%,40%{background:#ffd88a}100%{background:transparent}}
.rnum{font-family:'JetBrains Mono';font-weight:600;font-size:13px;width:38px;height:38px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:3px;background:#fff;transition:.2s}
.rnum.v2{background:var(--amber)} .rnum.v1{background:var(--teal);color:#fff;border-color:var(--teal)} .rnum.v0{background:var(--paper2);color:#7d948c}
.row p{font-size:15px;line-height:1.5}
.seg{display:flex;border:2px solid var(--ink);border-radius:3px;overflow:hidden;background:#fff;flex:none}
.seg button{width:48px;padding:10px 0;font:600 14px 'JetBrains Mono';background:#fff;border:0;border-right:2px solid var(--ink);cursor:pointer;transition:.12s;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--mint)}
.seg button.sel2{background:var(--amber)}
.seg button.sel1{background:var(--teal);color:#fff}
.seg button.sel0{background:#c9d4c4;color:var(--ink2)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;background:var(--paper2);border-top:2px solid var(--ink)}
.warn{display:none;margin:0 20px;background:#ffe9d6;border:2px solid var(--coral);border-radius:3px;padding:10px 14px;font-size:13.5px;color:#8a2c10}
.warn.show{display:block}

/* ── РЕЗУЛЬТАТЫ ── */
.result-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-bottom:24px}
.vcard{padding:30px;display:flex;flex-direction:column;gap:16px;animation:rise .5s ease both}
.stamp{align-self:flex-start;font-family:'Unbounded';font-weight:900;font-size:clamp(22px,3vw,32px);padding:10px 22px;border:4px solid var(--teal);color:var(--teal);border-radius:6px;background:rgba(15,123,108,.08);transform:rotate(-6deg);animation:stampIn .55s cubic-bezier(.3,1.6,.4,1) .2s both}
@keyframes stampIn{from{transform:scale(2.4) rotate(-16deg);opacity:0}60%{transform:scale(.93) rotate(-5deg)}to{transform:scale(1) rotate(-6deg);opacity:1}}
.psub{font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:'JetBrains Mono';font-size:11.5px;padding:5px 11px;border:1.5px solid var(--ink);border-radius:99px;background:#fff}
.chip.g{background:var(--mint)} .chip.c{background:#fff3d6;border-color:var(--amber-d)}
.desc{display:grid;gap:9px;margin-top:4px}
.desc div{display:grid;grid-template-columns:170px 1fr;gap:10px;font-size:13.5px;line-height:1.5;border-bottom:1px dashed #b9c8b6;padding-bottom:9px}
.desc dt{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7d948c;padding-top:2px}
.second{background:var(--paper2);border-left:4px solid var(--amber);padding:12px 14px;font-size:13.5px;line-height:1.55}
.card{padding:26px;animation:rise .5s .08s ease both}
.card h2,.details h2{font-size:16px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card h2::after,.details h2::after{content:"";flex:1;height:2px;background:var(--ink)}
.chart{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:150px 1fr 52px;gap:12px;align-items:center;font-size:13.5px}
.crow .clab{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrack{height:22px;background:var(--paper2);border:2px solid var(--ink);border-radius:2px;overflow:hidden}
.cfill{height:100%;width:0;transition:width 1.1s cubic-bezier(.5,0,.2,1)}
.cfill.p{background:var(--amber)} .cfill.s{background:var(--teal)} .cfill.o{background:#b9c8b6}
.crow .cval{font-family:'JetBrains Mono';font-size:12px;text-align:right}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:7px 8px;border-bottom:2px solid var(--ink);color:var(--ink2)}
.ptable td{padding:9px 8px;border-bottom:1px dashed #b9c8b6}
.ptable .n{text-align:right;font-family:'JetBrains Mono'}
.ptable tr.top td{background:#ffe9b8;font-weight:700}
.ptable tr.sub td{background:var(--mint)}
.ptable tr:hover td{background:#eef3ea}
.ptable tr.top:hover td{background:#ffe9b8}
.pre{font-family:'JetBrains Mono';font-size:12.5px;line-height:1.7;background:var(--paper2);border:2px solid var(--ink);border-radius:3px;padding:14px 16px;overflow-x:auto;white-space:pre}
.steps{list-style:none;counter-reset:st;display:grid;gap:10px;margin-top:6px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;font-size:13.5px;line-height:1.55;background:#fff;border:2px solid var(--ink);border-radius:3px}
.steps li::before{content:counter(st);position:absolute;left:10px;top:10px;width:26px;height:26px;display:grid;place-items:center;background:var(--amber);border:2px solid var(--ink);font:700 13px 'Unbounded'}
.details{padding:26px;margin-bottom:24px;animation:rise .5s .15s ease both}
.t2grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 30px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.actions .bar2{flex:1}
@media(max-width:900px){.intro,.result-grid{grid-template-columns:1fr}.t2grid{grid-template-columns:1fr}.crow{grid-template-columns:110px 1fr 46px}.desc div{grid-template-columns:1fr}.bar{position:static}}
@media print{
  body::before,body::after,.orb,.actions,.btn,.pages,.dotmap{display:none!important}
  body{background:#fff} main{padding:0;max-width:none}
  .sheet,.bar{box-shadow:none;break-inside:avoid}
  .details,.card,.vcard{animation:none}
}
</style>
</head>

 strong:"Энергичен, напорист, добивается результата под давлением, преодолевает препятствия",
 weak:"Нетерпелив, может провоцировать конфликты",
 func:"Тимлид, ведущий разработчик, «двигатель» спринта"},
{code:"Г",name:"Генератор идей",group:"мышление",items:[1,9,18,25,34,41,50],
 strong:"Креативен, предлагает нестандартные решения, видит задачу целиком",
 weak:"Пренебрегает деталями, слаб в коммуникации",
 func:"Архитектор решения, автор концепции продукта"},
{code:"К",name:"Объективный критик",group:"мышление",items:[5,12,17,28,39,47,54],
 strong:"Трезво анализирует, находит ошибки и риски, взвешивает альтернативы",
 weak:"Не вдохновляет других, медлителен в решениях",
 func:"Аналитик, ревьюер кода, тестировщик-стратег"},
{code:"О",name:"Организатор",group:"действие",items:[7,14,22,26,35,48,55],
 strong:"Дисциплинирован, переводит идеи в план и процедуры, надёжен",
 weak:"Негибок, с трудом принимает новые идеи",
 func:"Менеджер задач, ответственный за график и процессы"},
{code:"С",name:"Снабженец",group:"люди",items:[4,11,21,29,38,46,49],
 strong:"Общителен, находит контакты, ресурсы и информацию вне команды",
 weak:"Быстро теряет интерес после первого энтузиазма",
 func:"Связь с заказчиком и экспертами, исследование рынка и аналогов"},
{code:"Д",name:"Душа коллектива",group:"люди",items:[8,16,23,30,33,44,53],
 strong:"Поддерживает климат, сглаживает конфликты, чуток к людям",
 weak:"Нерешителен в критических ситуациях",
 func:"Фасилитатор, наставник новичков, «клей» команды"},
{code:"От",name:"Отделочник",group:"действие",items:[2,15,20,31,40,45,56],
 strong:"Доводит работу до конца, проверяет детали, следит за сроками",
 weak:"Тревожен, неохотно делегирует",
 func:"Ответственный за качество релиза, документацию, приёмку"}
];
const N=56, PAGE=14, PAGES=N/PAGE, MAXR=14, LS="belbin_lr1";

/* ═══════════ СОСТОЯНИЕ ═══════════ */
const $=s=>document.querySelector(s);
const state={name:"",answers:{},page:0,startedAt:0};
(function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d){state.name=d.name||"";state.answers=d.answers||{};state.startedAt=d.startedAt||0;}}catch(e){}})();
const save=()=>localStorage.setItem(LS,JSON.stringify({name:state.name,answers:state.answers,startedAt:state.startedAt}));
const answered=()=>Object.keys(state.answers).length;
const firstUnanswered=()=>{for(let n=1;n<=N;n++)if(state.answers[n]===undefined)return n;return 0};
const fmtTime=s=>Math.floor(s/60)+" мин "+String(s%60).padStart(2,"0")+" с";

/* ═══════════ ПОДСЧЁТ ═══════════ */
function compute(){
  const sums=ROLES.map(r=>({...r,sum:r.items.reduce((s,n)=>s+(state.answers[n]||0),0)}));
  const sorted=[...sums].sort((a,b)=>b.sum-a.sum||sums.indexOf(a)-sums.indexOf(b));
  const primary=sorted[0],secondary=sorted[1];
  const close=sorted.filter(r=>r!==primary&&primary.sum-r.sum<=2);
  return {sums,sorted,primary,secondary,close,tie:primary.sum===secondary.sum};
}

/* ═══════════ ЭКРАН 1: ВВОД ═══════════ */
function renderIntro(){
  const left=answered();
  $("#app").innerHTML=`
  <div class="intro">
    <div>
      <div class="kicker">Лабораторная работа № 1 · Методика Р. М. Белбина</div>
      <h1>Командные роли<br><em>в проектном деле</em></h1>
      <p class="lede">Адаптированный опросник из 56 утверждений определит ваш ролевой профиль: основную и вспомогательную командные роли. Результат пойдёт в сводную таблицу группы и в комплектование проектных команд.</p>
      <ul class="scale">
        <li class="s2"><b>2</b><span>утверждение полностью соответствует вашим деловым качествам</span></li>
        <li class="s1"><b>1</b><span>соответствует частично </span></li>
        <li class="s0"><b>0</b><span>не характеризует ваши деловые качества</span></li>
      </ul>
      <ul class="meta-rows">
        <li><span class="k">Утверждений</span><span class="v">56</span></li>
        <li><span class="k">Ролей</span><span class="v">8 · действие 3 · люди 3 · мышление 2</span></li>
        <li><span class="k">Максимум по роли</span><span class="v">14 баллов</span></li>
        <li><span class="k">Регламент</span><span class="v">≈ 15 минут, без ограничения</span></li>
      </ul>
    </div>
    <div class="sheet">
      <div class="perf"></div>
      <div class="watermark">ЛР-1</div>
      <div class="body">
        <span class="tag amber">опросник · таблица 2</span>
        <label class="f" for="cname">ФИО участника</label>
        <input class="f" id="cname" placeholder="Иванов Иван Иванович" value="${state.name}" autocomplete="name">
        <div class="note">Отвечайте <b>быстро, не возвращаясь</b> к предыдущим вопросам. Описывайте <b>реальное</b>, а не желаемое поведение. Все 56 утверждений обязательны.</div>
        <button class="btn" id="start">${left?`Продолжить · осталось ${N-left}`:"Начать опрос →"}</button>
        ${left?`<div class="resume">Сохранено ${left} из ${N} ответов. <a id="reset">Сбросить и начать заново</a></div>`:""}
      </div>
    </div>
  </div>`;
  $("#start").onclick=()=>{
    const n=$("#cname").value.trim();
    if(n.length<3){const i=$("#cname");i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");i.focus();return;}
    state.name=n; if(!state.startedAt)state.startedAt=Date.now();
    const u=firstUnanswered(); state.page=u?Math.floor((u-1)/PAGE):0;
    save(); renderQuiz();
  };
  const r=$("#reset");
  if(r)r.onclick=()=>{state.answers={};state.page=0;save();renderIntro();};
}

/* ═══════════ ЭКРАН 2: ОПРОС ═══════════ */
function renderQuiz(){
  const rows=[];
  for(let i=state.page*PAGE;i<(state.page+1)*PAGE;i++){
    const n=i+1,a=state.answers[n];
    rows.push(`<div class="row" id="row${n}">
      <span class="rnum ${a!==undefined?"v"+a:""}">${n}</span>
      <p>${STATEMENTS[i]}</p>
      <div class="seg" data-n="${n}">
        <button data-v="0" class="${a===0?"sel0":""}" title="не характеризует">0</button><button data-v="1" class="${a===1?"sel1":""}" title="соответствует частично">1</button><button data-v="2" class="${a===2?"sel2":""}" title="полностью соответствует">2</button>
      </div>
    </div>`);
  }
  const dots=Array.from({length:N},(_,i)=>`<button class="dot ${state.answers[i+1]!==undefined?"done":""} ${Math.floor(i/PAGE)===state.page?"cur":""}" data-n="${i+1}" title="№ ${i+1}"></button>`).join("");
  const pills=Array.from({length:PAGES},(_,p)=>{
    const done=Array.from({length:PAGE},(_,k)=>state.answers[p*PAGE+k+1]!==undefined).every(Boolean);
    return `<button class="ppill ${p===state.page?"cur":done?"done":""}" data-p="${p}">${done?"✓ ":""}стр. ${p+1}</button>`;
  }).join("");
  $("#app").innerHTML=`
  <div class="bar">
    <span class="id">ЛР-1 · ${state.name.split(" ").slice(0,2).join(" ")}</span>
    <div class="grow"><div class="track"><div class="fill" id="fill"></div></div></div>
    <span class="mono" id="cnt">${answered()} / ${N}</span>
  </div>
  <div class="pages">${pills}<span class="mono" style="margin-left:auto;font-size:12px;color:#9fc4b5">стр. ${state.page+1} / ${PAGES}</span></div>
  <div class="dotmap">${dots}</div>
  <div class="sheet qsheet">
    <div class="perf"></div>
    <div class="legend">
      <span><i style="background:var(--amber)"></i><b>2</b> — полностью соответствует</span>
      <span><i style="background:var(--teal)"></i><b>1</b> — частично</span>
      <span><i style="background:#c9d4c4"></i><b>0</b> — не характеризует</span>
    </div>
    <div class="warn" id="warn"></div>
    <div id="rows">${rows.join("")}</div>
    <div class="qnav">
      <button class="btn ghost" id="prev" ${state.page===0?"disabled":""}>← Назад</button>
      <span class="mono" style="font-size:12px;color:#7d948c">отвечено: ${answered()} из ${N}</span>
      ${state.page<PAGES-1
        ?`<button class="btn" id="next">Далее →</button>`
        :`<button class="btn" id="finish">Посчитать профиль ✔</button>`}
    </div>
  </div>`;
  requestAnimationFrame(()=>{$("#fill").style.width=(answered()/N*100)+"%"});

  $("#rows").addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b)return;
    const n=+b.parentElement.dataset.n,v=+b.dataset.v;
    state.answers[n]=v; save();
    const row=$("#row"+n);
    row.querySelector(".rnum").className="rnum v"+v;
    row.querySelectorAll(".seg button").forEach(x=>x.className=x.dataset.v==v?"sel"+v:"");
    updBar(); updDots(n);
  });
  document.querySelectorAll(".ppill").forEach(p=>p.onclick=()=>{state.page=+p.dataset.p;renderQuiz();});
  document.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{
    const n=+d.dataset.n,p=Math.floor((n-1)/PAGE);
    if(p!==state.page){state.page=p;renderQuiz();}
    flash(n);
  });
  $("#prev").onclick=()=>{if(state.page>0){state.page--;renderQuiz();}};
  const nx=$("#next"); if(nx)nx.onclick=()=>{state.page++;renderQuiz();};
  const fn=$("#finish"); if(fn)fn.onclick=tryFinish;
}
function updBar(){$("#cnt").textContent=answered()+" / "+N;$("#fill").style.width=(answered()/N*100)+"%";
  document.querySelectorAll(".ppill").forEach((p,i)=>{
    const done=Array.from({length:PAGE},(_,k)=>state.answers[i*PAGE+k+1]!==undefined).every(Boolean);
    p.classList.toggle("done",done); if(done&&!p.classList.contains("cur"))p.textContent="✓ стр. "+(i+1);
  });}
function updDots(n){const d=document.querySelector(`.dot[data-n="${n}"]`);if(d)d.classList.add("done");}
function flash(n){const r=$("#row"+n);if(r){r.scrollIntoView({block:"center",behavior:"smooth"});r.classList.remove("flash");void r.offsetWidth;r.classList.add("flash");}}
function tryFinish(){
  const u=firstUnanswered();
  if(u){
    const w=$("#warn");w.classList.add("show");
    w.textContent=`⚠ Осталось ответить: ${N-answered()} шт. Переходим к первому неотвеченному утверждению (№ ${u}).`;
    state.page=Math.floor((u-1)/PAGE);renderQuiz();setTimeout(()=>flash(u),80);
    return;
  }
  renderResult();
}

/* ═══════════ ЭКРАН 3: РЕЗУЛЬТАТЫ ═══════════ */
function renderResult(){
  const r=compute();
  const elapsed=Math.round((Date.now()-state.startedAt)/1000);
  const t2rows=(from,to)=>{let h="";for(let n=from;n<=to;n++)h+=`<tr><td class="n">${n}</td><td>${STATEMENTS[n-1]}</td><td class="n"><b>${state.answers[n]}</b></td></tr>`;return h};
  const chart=r.sorted.map((x,i)=>{
    const cls=i===0?"p":i===1?"s":"o";
    return `<div class="crow"><span class="clab" title="${x.name}">${x.name}</span><div class="ctrack"><div class="cfill ${cls}" data-w="${x.sum/MAXR*100}"></div></div><span class="cval">${x.sum}/${MAXR}</span></div>`;
  }).join("");
  const t3=r.sums.map(x=>{
    const cls=x===r.primary?"top":x===r.secondary?"sub":"";
    return `<tr class="${cls}"><td>${x.name}${x===r.primary?" ★":x===r.secondary?" ◆":""}</td><td class="n" style="white-space:nowrap">${x.items.join(", ")}</td><td class="n"><b>${x.sum}</b></td></tr>`;
  }).join("");
  const sumRow=[state.name,r.primary.name,r.secondary.name,...r.sums.map(x=>x.sum)].join("\t");
  $("#app").innerHTML=`
  <div class="bar"><span class="id">ОТЧЁТ · ЛР-1 · Командные роли Белбина</span><div class="grow"></div>
    <span class="mono" style="font-size:12px">${new Date().toLocaleString("ru-RU")} · ${fmtTime(elapsed)}</span></div>
  <div class="actions">
    <button class="btn" id="print">🖨 Печать отчёта</button>
    <button class="btn ghost" id="copy">Копировать таблицы</button>
    <button class="btn ghost" id="json">JSON ↓</button>
    <span class="bar2"></span>
    <button class="btn ghost" id="retry">Пройти заново</button>
  </div>
  <div class="result-grid">
    <div class="sheet vcard">
      <span class="tag teal">ролевой профиль</span>
      <div class="stamp">${r.primary.name}</div>
      <p class="psub">Вспомогательная роль — <b>${r.secondary.name}</b>${r.tie?". Суммы равны — допустимы обе":""}.</p>
      <div class="chips">
        <span class="chip g">группа «${r.primary.group}»</span>
        ${r.close.length?r.close.map(c=>`<span class="chip c">≈ ${c.name} (${c.sum})</span>`).join(""):""}
      </div>
      ${r.close.length?`<p style="font-size:13px;color:var(--ink2)">Роли с разницей ≤ 2 баллов взаимозаменяемы — вы способны исполнять любую из них в зависимости от ситуации.</p>`:""}
      <dl class="desc">
        <div><dt>Сильные стороны</dt><dd>${r.primary.strong}</dd></div>
        <div><dt>Допустимые слабости</dt><dd>${r.primary.weak}</dd></div>
        <div><dt>Функция в IT-проекте</dt><dd>${r.primary.func}</dd></div>
      </dl>
      <div class="second"><b>${r.secondary.name}</b> (вспом.) — ${r.secondary.func}.</div>
    </div>
    <div class="sheet card">
      <h2>Диаграмма «роль — баллы»</h2>
      <div class="chart">${chart}</div>
      <p style="font-size:12px;color:#7d948c;margin-top:12px">★ основная роль · ◆ вспомогательная · максимум по роли — 14 баллов</p>
    </div>
  </div>
  <div class="result-grid">
    <div class="sheet card">
      <h2>Таблица 3 — ключ опросника</h2>
      <table class="ptable"><thead><tr><th>Роль</th><th class="n">Номера утверждений</th><th class="n">Сумма</th></tr></thead><tbody>${t3}</tbody></table>
    </div>
    <div style="display:grid;gap:24px;align-content:start">
      <div class="sheet card">
        <h2>Строка для сводной таблицы группы</h2>
        <div class="pre">ФИО\tОсновная\tВспом.\tЛ\tР\tГ\tК\tО\tС\tД\tОт
${sumRow}</div>
        <p style="font-size:13px;color:var(--ink2);margin-top:10px">Передайте эту строку ответственному за сводную таблицу (шаг 4).</p>
      </div>
      <div class="sheet card">
        <h2>Дальше по плану работы</h2>
        <ol class="steps">
          <li><b>Комплектование:</b> команды 5–7 человек, в каждой закрыты все 8 ролей (допустимо вспомогательной ролью), без двух Лидеров и двух Реализаторов.</li>
          <li><b>Карта команды</b> по ГОСТ Р 54869-2011: заказчик и куратор — преподаватель, руководитель проекта — обычно Лидер или Организатор.</li>
          <li><b>Отчёт на команду:</b> сводная таблица, диаграмма «роль — баллы», анализ сбалансированности и вывод о распределении зон ответственности.</li>
        </ol>
      </div>
    </div>
  </div>
  <div class="sheet details">
    <h2>Таблица 2 — бланк ответов (заполнен)</h2>
    <div class="t2grid">
      <table class="ptable"><thead><tr><th class="n">№</th><th>Утверждение</th><th class="n">Баллы</th></tr></thead><tbody>${t2rows(1,28)}</tbody></table>
      <table class="ptable"><thead><tr><th class="n">№</th><th>Утверждение</th><th class="n">Баллы</th></tr></thead><tbody>${t2rows(29,56)}</tbody></table>
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".cfill").forEach(f=>f.style.width=f.dataset.w+"%");
  }));
  $("#print").onclick=()=>window.print();
  $("#retry").onclick=()=>{state.answers={};state.page=0;state.startedAt=0;save();renderIntro();};
  $("#copy").onclick=e=>{
    const txt=buildTSV(r);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>ok(e.target)).catch(()=>{
      const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();ok(e.target);
    });
  };
  $("#json").onclick=()=>{
    const data={lab:"ЛР-1. Командные роли Белбина",name:state.name,date:new Date().toISOString(),
      elapsedSec:elapsed,answers:state.answers,
      roleScores:Object.fromEntries(r.sums.map(x=>[x.name,x.sum])),
      primary:r.primary.name,secondary:r.secondary.name,
      closeRoles:r.close.map(c=>c.name)};
    const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download=`belbin_${state.name.split(" ")[0]||"result"}.json`;a.click();
  };
}
function ok(btn){const t=btn.textContent;btn.textContent="✓ Скопировано";setTimeout(()=>btn.textContent=t,1400);}
function buildTSV(r){
  let out="Таблица 2 — Утверждения опросника\n№\tУтверждение\tБаллы\n";
  for(let n=1;n<=N;n++)out+=`${n}\t${STATEMENTS[n-1]}\t${state.answers[n]}\n`;
  out+="\nТаблица 3 — Ключ опросника\nРоль\tНомера утверждений\tСумма баллов\n";
  r.sums.forEach(x=>out+=`${x.name}\t${x.items.join(", ")}\t${x.sum}\n`);
  out+=`\nРолевой профиль: ${state.name}\nОсновная роль: ${r.primary.name}\nВспомогательная роль: ${r.secondary.name}\n`;
  if(r.close.length)out+=`Близкие роли (разница ≤ 2): ${r.close.map(c=>c.name+" ("+c.sum+")").join(", ")}\n`;
  out+=`\nСтрока для сводной таблицы группы:\nФИО\tОсновная роль\tВспомогательная роль\tЛ\tР\tГ\tК\tО\tС\tД\tОт\n${[state.name,r.primary.name,r.secondary.name,...r.sums.map(x=>x.sum)].join("\t")}\n`;
  return out;
}
renderIntro();
</script>
</body>
</html>
